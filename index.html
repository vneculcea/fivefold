<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fivefold</title>
<style>
:root{
  --bg:#f7f7f5; --fg:#1d1d1f; --muted:#6b6b70; --border:#d3d3d6; --filled:#8e8e93;
  --key:#dcdce0; --key-fg:#1d1d1f;
  --hit:#3a9d5d; --near:#d4a72c; --miss:#7c7c82; --tile-fg:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141416; --fg:#f2f2f4; --muted:#9a9aa0; --border:#3a3a3e; --filled:#6a6a70;
    --key:#5a5a60; --key-fg:#f2f2f4; --miss:#3a3a3e; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;touch-action:manipulation;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:500px;display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid var(--border)}
h1{margin:0;font-size:1.6rem;letter-spacing:.06em;font-weight:800}
.icon-btn{background:none;border:1px solid var(--border);color:var(--fg);border-radius:8px;
  padding:6px 10px;font-size:.85rem;cursor:pointer}
.icon-btn:hover{border-color:var(--filled)}
.opts{display:flex;gap:8px;align-items:center}
label.hard{font-size:.8rem;color:var(--muted);display:flex;gap:4px;align-items:center;cursor:pointer}
main{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:8px 16px;min-height:0}
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;
  height:min(100%,396px);max-width:100%;aspect-ratio:5/6}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.1rem,4.5dvh,2rem);font-weight:800;text-transform:uppercase;user-select:none}
.tile.filled{border-color:var(--filled);animation:pop .1s}
.tile.hit,.tile.near,.tile.miss{color:var(--tile-fg);border-color:transparent}
.tile.hit{background:var(--hit)} .tile.near{background:var(--near)} .tile.miss{background:var(--miss)}
.tile.flip{animation:flip .5s ease forwards}
.row.shake{animation:shake .4s}
.tile.bounce{animation:bounce .5s}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes bounce{40%{transform:translateY(-18px)}70%{transform:translateY(4px)}}
#keyboard{width:100%;max-width:500px;padding:0 8px 12px}
.krow{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.key{flex:1;height:clamp(40px,7.5dvh,58px);border:0;border-radius:6px;background:var(--key);color:var(--key-fg);
  font-weight:700;font-size:.95rem;text-transform:uppercase;cursor:pointer;padding:0;min-width:0}
.key.wide{flex:1.5;font-size:.75rem}
.key.hit{background:var(--hit);color:#fff}.key.near{background:var(--near);color:#fff}.key.miss{background:var(--miss);color:#fff}
.spacer{flex:.5}
@media (max-width:360px){h1{font-size:1.25rem}header{padding:8px 10px}.icon-btn{padding:5px 8px}.krow{gap:4px}}
.title{text-align:center;line-height:1.1}
#sub{font-size:.72rem;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.share-preview{font-family:inherit;font-size:1.05rem;line-height:1.25;margin:0 0 14px;white-space:pre;user-select:all}
.end-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.next{text-align:left}.next span{display:block;font-size:.75rem;color:var(--muted)}.next b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:6px;font-size:.85rem}
.mode{display:flex;gap:4px;margin-top:8px;padding:3px;border:1px solid var(--border);border-radius:999px}
.mode button{background:none;border:0;color:var(--muted);font:inherit;font-size:.8rem;font-weight:700;padding:5px 16px;border-radius:999px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.mode button:focus-visible,.icon-btn:focus-visible,.key:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
body.practice #sub{color:var(--near)}
.stats-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:14px}
.stats{margin-top:6px!important}
.secondary{background:none;color:var(--fg);border:2px solid var(--border);border-radius:8px;padding:10px 16px;font-weight:700;font-size:1rem;cursor:pointer}
#toast{position:fixed;top:112px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.show{display:flex}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:360px;text-align:center;max-height:calc(100dvh - 32px);overflow-y:auto}
.card h2{margin:0 0 6px}
.stats{display:flex;justify-content:space-around;margin:16px 0}
.stat b{display:block;font-size:1.6rem}.stat span{font-size:.7rem;color:var(--muted)}
.dist{text-align:left;font-size:.8rem;margin-bottom:16px}
.bar{display:flex;align-items:center;gap:6px;margin:3px 0}
.bar i{display:block;background:var(--miss);color:#fff;font-style:normal;padding:2px 6px;text-align:right;min-width:20px}
.bar i.cur{background:var(--hit)}
.primary{background:var(--hit);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-weight:700;font-size:1rem;cursor:pointer}
.help{text-align:left;font-size:.9rem;line-height:1.45}
.help .ex{display:flex;gap:4px;margin:8px 0}
.help .ex .tile{width:34px;height:34px;font-size:1.1rem}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="helpBtn" aria-label="How to play">?</button>
  <div class="title"><h1>FIVEFOLD</h1><div id="sub"></div></div>
  <div class="opts">
    <label class="hard"><input type="checkbox" id="hard">Hard</label>
    <button class="icon-btn" id="statsBtn">Stats</button>
  </div>
</header>
<div class="mode" role="group" aria-label="Game mode"><button data-mode="daily" aria-pressed="true">Daily</button><button data-mode="practice" aria-pressed="false">Practice</button></div>
<main><div id="board"></div></main>
<div id="keyboard"></div>
<div id="toast"></div>
<div id="modal"><div class="card" id="card"></div></div>

// Words are lightly scrambled so peeking at the source doesn't spoil them.
const decode = s => [...s].map((c,i)=>String.fromCharCode((c.charCodeAt(0)-97-(i*7+3)%26+52)%26+97)).join('').split('').reverse().join('');
const SCHEDULE = W.s.map(decode);           // SCHEDULE[0] = Oct 28 2026, SCHEDULE[365] = Oct 28 2027
const PRACTICE = W.p.map(decode);           // 1,000 practice words, none of them used as daily words
const VALID = new Set([...W.v, ...SCHEDULE, ...PRACTICE]);
const START = Date.UTC(2026, 9, 28);         // months are 0-based: 9 = October
const GAME = 'Fivefold';

/* ---------- date: uses the device's local calendar date ---------- */
function dayIndex(d = new Date()){
  return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - START) / 864e5);
}
function dateLabel(i){const d=new Date(START+i*864e5);return d.toLocaleDateString(undefined,{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'});}

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
const mem = {};
const store = {
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):mem[k]??null;}catch(e){return mem[k]??null;}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const blankStats = () => ({played:0, won:0, streak:0, best:0, dist:[0,0,0,0,0,0], lastWin:null});
let dstats = Object.assign(blankStats(), store.get('ff-stats') || {});   // daily
let pstats = Object.assign(blankStats(), store.get('ff-pstats') || {});  // practice

/* ---------- elements ---------- */
const board = document.getElementById('board'), kb = document.getElementById('keyboard');
const toastEl = document.getElementById('toast'), modal = document.getElementById('modal'), card = document.getElementById('card');
const hardBox = document.getElementById('hard'), sub = document.getElementById('sub');
const modeBtns = document.querySelectorAll('.mode button');

let mode = store.get('ff-mode') === 'practice' ? 'practice' : 'daily';
let day, pIndex, answer, row, col, guesses, results, over, won, busy, keyState, hints;

/* ---------- build board & keyboard ---------- */
for (let r=0;r<6;r++){const d=document.createElement('div');d.className='row';
  for(let c=0;c<5;c++){const t=document.createElement('div');t.className='tile';d.appendChild(t);}board.appendChild(d);}
const layout=["qwertyuiop","asdfghjkl","↵zxcvbnm⌫"];
layout.forEach((line,i)=>{const r=document.createElement('div');r.className='krow';
  if(i===1){r.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));}
  for(const ch of line){const b=document.createElement('button');b.className='key';
    if(ch==='↵'){b.textContent='Enter';b.classList.add('wide');b.dataset.k='Enter';}
    else if(ch==='⌫'){b.textContent='⌫';b.classList.add('wide');b.dataset.k='Backspace';b.style.fontSize='1.2rem';}
    else{b.textContent=ch;b.dataset.k=ch;}
    b.addEventListener('click',()=>{handle(b.dataset.k);b.blur();});r.appendChild(b);}
  if(i===1){r.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));}
  kb.appendChild(r);});

function tile(r,c){return board.children[r].children[c];}
function toast(msg,ms=1400){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),ms);}

/* ---------- game setup ---------- */
function resetBoard(){
  row=0;col=0;guesses=[];results=[];over=false;won=false;busy=false;keyState={};hints={hit:{},near:new Set()};
  for(let r=0;r<6;r++)for(let c=0;c<5;c++){const t=tile(r,c);t.textContent='';t.className='tile';}
  document.querySelectorAll('.key').forEach(k=>k.classList.remove('hit','near','miss'));
  modal.classList.remove('show');
  hardBox.checked = !!store.get('ff-hard'); hardBox.disabled = false;
  modeBtns.forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===mode));
  document.body.classList.toggle('practice', mode==='practice');
}
function restore(saved){
  hardBox.checked = saved.hard;
  saved.guesses.forEach(g=>{ for(let i=0;i<5;i++) tile(row,i).textContent=g[i]; applyResult(g, score(g,answer), false); });
  if(guesses.length) hardBox.disabled = true;
  if(over) setTimeout(()=>showEnd(),300);
}
function loadGame(){ resetBoard(); mode==='practice' ? loadPractice() : loadToday(); }

function loadToday(){
  day = dayIndex();
  if(day < 0){ answer=null; over=true; sub.textContent='Starts Oct 28, 2026';
    return showMessage('Not yet!', `The first daily puzzle unlocks on <b>Oct 28, 2026</b>. Try Practice in the meantime.`); }
  if(day >= SCHEDULE.length){ answer=null; over=true; sub.textContent='Season over';
    return showMessage('That’s a wrap!', `The daily list ran from Oct 28, 2026 to Oct 28, 2027. Practice mode still works.`); }
  answer = SCHEDULE[day];
  sub.textContent = `#${day+1} · ${dateLabel(day)}`;
  const saved = store.get('ff-day');
  if(saved && saved.day===day) restore(saved);
  else if(!store.get('ff-seen')) { store.set('ff-seen',true); showHelp(); }
}

// practice: resume an unfinished game, otherwise pick a new random word
function loadPractice(fresh){
  const saved = store.get('ff-prac');
  if(!fresh && saved && saved.guesses && PRACTICE[saved.i]){
    pIndex = saved.i; answer = PRACTICE[pIndex];
    sub.textContent = 'Practice · unlimited games';
    return restore(saved);
  }
  const last = saved ? saved.i : -1;
  do { pIndex = Math.floor(Math.random()*PRACTICE.length); } while(pIndex===last && PRACTICE.length>1);
  answer = PRACTICE[pIndex];
  sub.textContent = 'Practice · unlimited games';
  store.set('ff-prac',{i:pIndex,guesses:[],hard:hardBox.checked});
}
function newPractice(){ resetBoard(); loadPractice(true); }

function setMode(m){
  if(m===mode || busy) return;
  mode=m; store.set('ff-mode',m); loadGame();
  toast(m==='practice' ? 'Practice mode' : 'Daily word');
}

/* ---------- scoring (two passes, so repeated letters are handled correctly) ---------- */
function score(guess,target){
  const res=Array(5).fill('miss'),left={};
  for(let i=0;i<5;i++){if(guess[i]===target[i])res[i]='hit';else left[target[i]]=(left[target[i]]||0)+1;}
  for(let i=0;i<5;i++){if(res[i]!=='hit'&&left[guess[i]]>0){res[i]='near';left[guess[i]]--;}}
  return res;
}
function hardCheck(g){
  for(const [i,ch] of Object.entries(hints.hit)) if(g[i]!==ch) return `${ordinal(+i+1)} letter must be ${ch.toUpperCase()}`;
  for(const ch of hints.near) if(!g.includes(ch)) return `Guess must contain ${ch.toUpperCase()}`;
  return null;
}
function ordinal(n){return n+(['th','st','nd','rd'][n]||'th');}

/* ---------- input ---------- */
function handle(k){
  if(over||busy)return;
  if(k==='Enter')return submit();
  if(k==='Backspace'){if(col>0){col--;const t=tile(row,col);t.textContent='';t.classList.remove('filled');}return;}
  if(/^[a-z]$/.test(k)&&col<5){const t=tile(row,col);t.textContent=k;t.classList.add('filled');col++;}
}
function shake(msg){toast(msg);const r=board.children[row];r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');}

function submit(){
  if(col<5)return shake('Not enough letters');
  const g=[...board.children[row].children].map(t=>t.textContent).join('');
  if(!VALID.has(g))return shake('Not in word list');
  if(hardBox.checked){const e=hardCheck(g);if(e)return shake(e);}
  hardBox.disabled=true;
  const res=score(g,answer);busy=true;
  res.forEach((s,i)=>{const t=tile(row,i);
    setTimeout(()=>{t.classList.add('flip');setTimeout(()=>t.classList.add(s),250);},i*300);});
  setTimeout(()=>{busy=false;applyResult(g,res,true);},5*300+250);
}

// record a scored guess; animate=false when restoring a saved game
function applyResult(g,res,animate){
  const rank={miss:0,near:1,hit:2};
  res.forEach((s,i)=>{const ch=g[i];
    if(!animate) tile(row,i).classList.add(s);
    if(s==='hit')hints.hit[i]=ch; if(s==='near')hints.near.add(ch);
    if(!keyState[ch]||rank[s]>rank[keyState[ch]]){keyState[ch]=s;
      const key=kb.querySelector(`[data-k="${ch}"]`);key.classList.remove('hit','near','miss');key.classList.add(s);}});
  guesses.push(g);results.push(res);
  if(g===answer){over=true;won=true;}
  else if(guesses.length===6){over=true;}
  else{row++;col=0;}
  if(!animate) return;
  if(mode==='practice') store.set('ff-prac',{i:pIndex,guesses,hard:hardBox.checked});
  else store.set('ff-day',{day,guesses,hard:hardBox.checked});
  if(won){
    [...board.children[row].children].forEach((t,i)=>setTimeout(()=>t.classList.add('bounce'),i*90));
    toast(['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'][row],1800);
    record(true);setTimeout(showEnd,1900);
  } else if(over){toast(answer.toUpperCase(),3000);record(false);setTimeout(showEnd,2200);}
}

function record(win){
  if(mode==='practice'){
    pstats.played++;
    if(win){pstats.won++;pstats.streak++;pstats.best=Math.max(pstats.best,pstats.streak);pstats.dist[guesses.length-1]++;}
    else pstats.streak=0;
    return store.set('ff-pstats',pstats);
  }
  dstats.played++;
  if(win){dstats.won++;dstats.streak = (dstats.lastWin===day-1) ? dstats.streak+1 : 1;dstats.lastWin=day;
    dstats.best=Math.max(dstats.best,dstats.streak);dstats.dist[guesses.length-1]++;}
  else dstats.streak=0;
  store.set('ff-stats',dstats);
}
const curStats = () => mode==='practice' ? pstats : dstats;
// a daily streak breaks if a day is skipped; a practice streak counts wins in a row
function currentStreak(){
  if(mode==='practice') return pstats.streak;
  return (dstats.lastWin!==null && dayIndex()-dstats.lastWin<=1) ? dstats.streak : 0;
}

/* ---------- share text, Wordle style ---------- */
function shareText(){
  const emoji={hit:'🟩',near:'🟨',miss:'⬛'};
  const label = mode==='practice' ? `${GAME} Practice` : `${GAME} #${day+1}`;
  const head=`${label} ${won?guesses.length:'X'}/6${hardBox.checked?'*':''}`;
  return head+'\n\n'+results.map(r=>r.map(s=>emoji[s]).join('')).join('\n');
}
async function share(){
  const text=shareText();
  try{ if(navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){ await navigator.share({text}); return; } }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Copied results to clipboard'); return; }catch(e){}
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copied results to clipboard');}catch(e){toast('Select the text above to copy');}
  ta.remove();
}

/* ---------- modals ---------- */
function statsHTML(){
  const s=curStats(), max=Math.max(1,...s.dist);
  return `<div class="stats-label">${mode==='practice'?'Practice stats':'Daily stats'}</div>
    <div class="stats">
      <div class="stat"><b>${s.played}</b><span>Played</span></div>
      <div class="stat"><b>${s.played?Math.round(100*s.won/s.played):0}</b><span>Win %</span></div>
      <div class="stat"><b>${currentStreak()}</b><span>Streak</span></div>
      <div class="stat"><b>${s.best}</b><span>Best</span></div></div>
    <div class="dist">${s.dist.map((n,i)=>`<div class="bar">${i+1}<i class="${over&&won&&i===guesses.length-1?'cur':''}" style="width:${8+92*n/max}%">${n}</i></div>`).join('')}</div>`;
}
function countdown(){
  const now=new Date(), next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const s=Math.max(0,Math.floor((next-now)/1000));
  return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');
}
function showEnd(){
  const practice = mode==='practice';
  const left = practice
    ? `<button class="secondary" id="newBtn">New word</button>`
    : `<div class="next"><span>Next word in</span><b id="cd">${countdown()}</b></div>`;
  card.innerHTML=`<h2>${won?'You got it!':'Out of guesses'}</h2>
    <div>The word was <b>${answer.toUpperCase()}</b></div>
    ${statsHTML()}
    <pre class="share-preview">${shareText()}</pre>
    <div class="end-row">${left}<button class="primary" id="shareBtn">Share</button></div>
    ${practice ? '' : '<button class="link" id="toPractice">Keep playing in Practice</button>'}
    <button class="link" id="close">Close</button>`;
  modal.classList.add('show');
  document.getElementById('shareBtn').onclick=share;
  document.getElementById('close').onclick=()=>modal.classList.remove('show');
  if(practice) document.getElementById('newBtn').onclick=newPractice;
  else document.getElementById('toPractice').onclick=()=>setMode('practice');
}
function showStats(){
  if(over && answer) return showEnd();
  card.innerHTML=`<h2>Statistics</h2>${statsHTML()}<button class="primary" id="close">Close</button>`;
  modal.classList.add('show');document.getElementById('close').onclick=()=>modal.classList.remove('show');
}
function showMessage(title,body){
  card.innerHTML=`<h2>${title}</h2><p>${body}</p><button class="primary" id="toPractice">Play Practice</button>`;
  modal.classList.add('show');document.getElementById('toPractice').onclick=()=>setMode('practice');
}
function showHelp(){
  const ex=(w,i,c)=>`<div class="ex">${[...w].map((ch,j)=>`<div class="tile ${j===i?c:''}">${ch}</div>`).join('')}</div>`;
  card.innerHTML=`<h2>How to play</h2><div class="help">
    <p>Guess the five-letter word in six tries.</p>
    ${ex('flame',0,'hit')}<p><b>F</b> is in the word and in the right spot.</p>
    ${ex('pilot',1,'near')}<p><b>I</b> is in the word but in a different spot.</p>
    ${ex('vague',3,'miss')}<p><b>U</b> is not in the word.</p>
    <p><b>Daily:</b> everyone gets the same word each day, and a new one appears at midnight.</p>
    <p><b>Practice:</b> play as many random words as you like. Practice words are never used as daily words, and practice has its own stats.</p>
    <p><b>Hard mode:</b> letters you've found must be used in later guesses. You can only switch it before your first guess.</p></div>
    <button class="primary" id="close">Let's play</button>`;
  modal.classList.add('show');document.getElementById('close').onclick=()=>modal.classList.remove('show');
}

/* ---------- events ---------- */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(modal.classList.contains('show')){if(e.key==='Escape'||(e.key==='Enter'&&!document.getElementById('shareBtn'))){e.preventDefault();document.getElementById('close')?.click();}return;}
  if(e.key==='Enter'||e.key==='Backspace'){e.preventDefault();handle(e.key);}
  else if(/^[a-zA-Z]$/.test(e.key))handle(e.key.toLowerCase());
});
hardBox.addEventListener('change',()=>store.set('ff-hard',hardBox.checked));
modeBtns.forEach(b=>b.addEventListener('click',()=>{setMode(b.dataset.mode);b.blur();}));
document.getElementById('statsBtn').onclick=()=>{showStats();document.activeElement.blur();};
document.getElementById('helpBtn').onclick=showHelp;
modal.addEventListener('click',e=>{if(e.target===modal&&answer)modal.classList.remove('show');});
// keep the countdown ticking, and switch to the new daily word if the page is left open past midnight
setInterval(()=>{const cd=document.getElementById('cd');if(cd)cd.textContent=countdown();
  if(mode==='daily'&&dayIndex()!==day&&!busy)loadGame();},1000);

loadGame();
</script>
</body>
